spring:
  application:
    name: "gateway"


  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: flow-manager
              uri: lb://flow-manager
              predicates:
                - Path=/api/v1/files/**


server:
  port: 8765

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_ENDPOINT:http://localhost:8761/eureka}
